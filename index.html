<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório dos Grupos Familiares</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-slate-50 to-slate-200 min-h-screen text-slate-800">

  <!-- Header -->
  <header class="relative bg-gradient-to-r from-indigo-700 via-indigo-600 to-purple-700 text-white shadow-lg pb-10">
    <div class="max-w-4xl mx-auto px-4 pt-8 pb-2 text-center">
      <img src="ieadpe-CYzhLUVg.png" alt="Logo IEADPE" class="h-16 md:h-20 mx-auto mb-4 drop-shadow-lg">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Coordenação dos Grupos Familiares</h1>
      <p class="text-indigo-200 text-sm mt-2">Lançamento de Relatórios &amp; Atualização de Perfil</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-10">
    <!-- MENU INICIAL -->
    <section id="menu-inicial" class="max-w-2xl mx-auto mt-10 md:mt-14">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <button onclick="selecionarOpcao('relatorio')" class="group bg-white rounded-2xl shadow-lg border border-slate-100 p-8 text-center transition duration-200 hover:shadow-xl hover:-translate-y-1 hover:border-indigo-200">
          <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-indigo-50 flex items-center justify-center text-3xl group-hover:bg-indigo-100 transition">📊</div>
          <h2 class="text-lg font-bold text-indigo-900">Lançar Relatório</h2>
          <p class="text-sm text-slate-500 mt-1">Envie o relatório mensal de desempenho da congregação</p>
        </button>
        <button onclick="selecionarOpcao('secretaria')" class="group bg-white rounded-2xl shadow-lg border border-slate-100 p-8 text-center transition duration-200 hover:shadow-xl hover:-translate-y-1 hover:border-indigo-200">
          <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-indigo-50 flex items-center justify-center text-3xl group-hover:bg-indigo-100 transition">👤</div>
          <h2 class="text-lg font-bold text-indigo-900">Perfil da Secretária</h2>
          <p class="text-sm text-slate-500 mt-1">Cadastre ou atualize os dados da secretária</p>
        </button>
      </div>
    </section>

    <!-- Menu de Navegação Centralizado (visível apenas dentro de um formulário) -->
    <div id="tabs-nav" class="hidden justify-center mt-10 md:mt-14 mb-8">
      <div class="inline-flex items-center gap-1 bg-white p-1.5 rounded-full shadow-lg border border-slate-100">
        <button onclick="voltarMenu()" class="px-4 py-2.5 rounded-full font-semibold text-sm text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-all duration-200" title="Voltar ao menu">
          ←
        </button>
        <button id="tab-relatorio-btn" onclick="switchTab('relatorio')" class="px-5 py-2.5 rounded-full font-semibold text-sm transition-all duration-200 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md">
          📊 Lançar Relatório
        </button>
        <button id="tab-secretaria-btn" onclick="switchTab('secretaria')" class="px-5 py-2.5 rounded-full font-semibold text-sm transition-all duration-200 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50">
          👤 Perfil da Secretária
        </button>
      </div>
    </div>

    <!-- FORMULÁRIO RELATÓRIO -->
    <section id="form-relatorio" class="hidden bg-white p-6 rounded-xl shadow-lg border border-slate-100">
      <h2 class="text-xl font-bold mb-4 text-indigo-900 border-l-4 border-indigo-600 pl-3">Relatório Mensal de Desempenho</h2>
      <form id="relatorioForm" onsubmit="enviarDados(event, 'relatorio')" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Área</label>
            <select id="rel-area" required onchange="atualizarCongregacoes('rel-area', 'rel-congregacao')" class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="">Selecione a Área</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Congregação</label>
            <select id="rel-congregacao" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="">Selecione a Área primeiro</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Mês/Ano</label>
            <select id="rel-mesAno" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="">Selecione o Mês/Ano</option>
            </select>
          </div>
        </div>

        <hr class="my-4 border-slate-200">

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <div><label class="block text-xs font-semibold mb-1">Grupos Formados</label><input type="number" id="rel-gruposFormados" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Matriculados</label><input type="number" id="rel-matriculados" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Presentes</label><input type="number" id="rel-presentes" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Voluntários</label><input type="number" id="rel-voluntarios" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Famílias Visitadas</label><input type="number" id="rel-familiasVisitadas" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Pessoas Visitadas</label><input type="number" id="rel-pessoasVisitadas" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Literaturas Distrib.</label><input type="number" id="rel-literaturas" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Conversões</label><input type="number" id="rel-conversoes" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Batismos no Esp. Santo</label><input type="number" id="rel-batismos" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
          <div><label class="block text-xs font-semibold mb-1">Curas</label><input type="number" id="rel-curas" min="0" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"></div>
        </div>

        <button type="submit" class="w-full mt-6 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          Enviar Relatório
        </button>
      </form>
    </section>

    <!-- FORMULÁRIO SECRETÁRIA -->
    <section id="form-secretaria" class="bg-white p-6 rounded-xl shadow-lg border border-slate-100 hidden">
      <h2 class="text-xl font-bold mb-4 text-indigo-900 border-l-4 border-indigo-600 pl-3">Perfil da Secretária</h2>
      <form id="secretariaForm" onsubmit="enviarDados(event, 'secretaria')" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Área</label>
            <select id="sec-area" required onchange="atualizarCongregacoes('sec-area', 'sec-congregacao')" class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="">Selecione a Área</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Congregação</label>
            <select id="sec-congregacao" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="">Selecione a Área primeiro</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Nome Completo</label>
            <input type="text" id="sec-nome" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Função</label>
            <select id="sec-funcao" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="1ª Secretária">1ª Secretária</option>
              <option value="2ª Secretária">2ª Secretária</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Data de Nascimento</label>
            <input type="date" id="sec-dataNascimento" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Nº Cartão de Membro</label>
            <input type="text" id="sec-numeroCartao" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Apresentada?</label>
            <select id="sec-apresentada" required class="w-full p-2 border border-slate-300 rounded-md transition focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full mt-6 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          Salvar Perfil
        </button>
      </form>
    </section>
  </main>

  <script>
    // URL do Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbzJPNUdzfTPMCAs2tdPzbMw2rcrBw2iw4hup6XRzk2hG7cEGeRErzPdmDGXiPQrMkCC/exec"; 

    // Mapeamento dos Dados de Área e Congregação (Corrigido Área 11 e 12)
    const dadosAreas = {
      "1": ["MATRIZ", "ANTONIO CASSIMIRO I", "AREIA BRANCA I", "JARDIM MARAVILHA", "MARIA AUXILIADORA", "NOVA ATRÁS DA BANCA", "OURO PRETO", "PALHINHAS", "VILA EULÁLIA"],
      "2": ["AREIA BRANCA II", "FERNANDO IDALINO I", "FERNANDO IDALINO II", "HENRIQUE LEITE I", "HENRIQUE LEITE II", "NOVA VILA VITÓRIA", "NOVO JATOBÁ", "PORTO DA ILHA", "RIVER SHOPPING", "VILA EDUARDO", "VILA VITÓRIA I"],
      "3": ["ALTO DA BOA VISTA", "COHAB IV", "COHAB V", "JARDIM PETRÓPOLIS III", "SÃO GONÇALO I", "SÃO GONÇALO II", "SÃO GONÇALO III"],
      "4": ["JOSÉ E MARIA I", "JOSÉ E MARIA II", "JOSÉ E MARIA III", "MONSENHOR BERNARDINO", "NOVA VILA MARCELA", "NOVO LOTEAMENTO RECIFE", "VILA DÉBORA I", "VIVENDAS", "VILA DÉBORA II"],
      "5": ["ALTO DO COCÁ", "JARDIM AMAZONAS I", "JARDIM SÃO PAULO I", "PEDRO RAIMUNDO", "QUATI", "VALE G. RIO I"],
      "6": ["ÁREA 19", "KM - 22", "KM - 25"],
      "7": ["ASSENTAMENTO MANDACARU", "FAZENDA VENEZA", "N - 1", "N - 2", "N - 3", "PONTA DA SERRA", "PORTEIRAS", "SITIO BARRAGEM"],
      "8": ["BEBEDOURO", "NOVA DESCOBERTA I", "NOVA DESCOBERTA III", "PEDRINHAS", "POÇO DA CRUZ", "PORTO DE PALHA", "SERROTE DE JESUS I", "SERROTE DE JESUS II"],
      "9": ["ALTO DA AREIA", "ALTO GRANDE", "ASSENTAMENTO JOSÉ RAMOS", "ASSENTAMENTO SÃO FRANCISCO", "FAZENDA TANQUE", "ISACOLÂNDIA I", "ISACOLÂNDIA II", "LAGOA GRANDE I", "LAGOA GRANDE III", "LAGOA GRANDE V", "RUA DO CAJUEIRO", "VASCO"],
      "10": ["ASSENTAMENTO CACHOEIRA", "CAPIM", "N - 10", "N - 11", "VILA 12", "VILA RENASCER"],
      "11": ["ASSENTAMENTO ESPERANÇA", "MASSAPÊ", "PAU FERRO", "RAJADA", "URUAIS"],
      "12": ["CAITITU"],
      "13": ["AGROVILA MASSANGANO", "COHAB VI", "ROÇADO", "SITIO SÃO JOÃO", "TAPERA", "TERRA DURA"],
      "14": ["COSME DAMIÃO I", "COSME DAMIÃO II", "JOÃO DE DEUS I", "JOÃO DE DEUS II", "JOÃO DE DEUS III", "JOÃO DE DEUS IV", "JOÃO DE DEUS V",  "NOVO TEMPO", "PEDRA LINDA I", "PEDRA LINDA III"],
      "15": ["ASSENTAMENTO ÁGUA VIVA I", "ASSENTAMENTO ÁGUA VIVA II", "C - 2", "LOTEAMENTO SIQUEIRA", "N - 4 I", "N - 4 II", "N - 5 I", "N - 5 II"],
      "16": ["CALDEIRÃOZINHO"],
      "17": ["DOM AVELAR I", "DOM AVELAR II", "DOM AVELAR IV", "MANDACARU I", "MANDACARU II", "SANTA LUZIA I", "SÃO JOAQUIM", "SÃO JORGE", "TERRA DO SUL I", "TERRA DO SUL II", "VILA ESPERANÇA"],
      "18": ["AGROISIA", "CATALUNIA", "CRUZ DO PONTAL", "ILHA DO PONTAL", "OURO VERDE", "VERMELHOS I", "VERMELHOS III"],
      "19": ["N - 6 I", "N - 6 II", "N - 6 III", "N - 7 I", "N - 7 II", "C - 3", "N - 8 I", "N - 8 II", "N - 9 I", "N - 9 II"],
      "20": ["RIO CORRENTE", "ASSENTAMENTO SÃO PAULO", "JARDIM GUARARAPES", "NOVA PETROLINA", "RESIDENCIAL BRASIL", "RESIDENCIAL POMARES", "JARDIM PETRÓPOLIS I", "JARDIM PETRÓPOLIS II"]
    };

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      carregarAreas();
      carregarMeses();
    });

    function carregarAreas() {
      const relArea = document.getElementById("rel-area");
      const secArea = document.getElementById("sec-area");
      
      Object.keys(dadosAreas).forEach(area => {
        const opt1 = new Option(`Área ${area}`, area);
        const opt2 = new Option(`Área ${area}`, area);
        relArea.add(opt1);
        secArea.add(opt2);
      });
    }

    function atualizarCongregacoes(areaSelectId, congSelectId) {
      const area = document.getElementById(areaSelectId).value;
      const congSelect = document.getElementById(congSelectId);
      congSelect.innerHTML = '<option value="">Selecione a Congregação</option>';

      if (area && dadosAreas[area]) {
        dadosAreas[area].forEach(cong => {
          congSelect.add(new Option(cong, cong));
        });
      }
    }

    function carregarMeses() {
      const mesSelect = document.getElementById("rel-mesAno");
      const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      const anoAtual = new Date().getFullYear();

      meses.forEach((mes) => {
        const valor = `${mes}/${anoAtual}`;
        mesSelect.add(new Option(valor, valor));
      });
    }

    function switchTab(tab) {
      const formRel = document.getElementById("form-relatorio");
      const formSec = document.getElementById("form-secretaria");
      const btnRel = document.getElementById("tab-relatorio-btn");
      const btnSec = document.getElementById("tab-secretaria-btn");

      const active = "px-5 py-2.5 rounded-full font-semibold text-sm transition-all duration-200 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-md";
      const inactive = "px-5 py-2.5 rounded-full font-semibold text-sm transition-all duration-200 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50";

      if (tab === 'relatorio') {
        formRel.classList.remove("hidden");
        formSec.classList.add("hidden");
        btnRel.className = active;
        btnSec.className = inactive;
      } else {
        formSec.classList.remove("hidden");
        formRel.classList.add("hidden");
        btnSec.className = active;
        btnRel.className = inactive;
      }
    }

    function selecionarOpcao(tab) {
      document.getElementById("menu-inicial").classList.add("hidden");
      document.getElementById("tabs-nav").classList.remove("hidden");
      document.getElementById("tabs-nav").classList.add("flex");
      switchTab(tab);
    }

    function voltarMenu() {
      document.getElementById("form-relatorio").classList.add("hidden");
      document.getElementById("form-secretaria").classList.add("hidden");
      document.getElementById("tabs-nav").classList.add("hidden");
      document.getElementById("tabs-nav").classList.remove("flex");
      document.getElementById("menu-inicial").classList.remove("hidden");
    }

    async function enviarDados(event, tipo) {
      event.preventDefault();
      
      let payload = { tipo: tipo };

      if (tipo === 'relatorio') {
        payload.area = document.getElementById("rel-area").value;
        payload.congregacao = document.getElementById("rel-congregacao").value;
        payload.mesAno = document.getElementById("rel-mesAno").value;
        payload.gruposFormados = document.getElementById("rel-gruposFormados").value;
        payload.matriculados = document.getElementById("rel-matriculados").value;
        payload.presentes = document.getElementById("rel-presentes").value;
        payload.voluntarios = document.getElementById("rel-voluntarios").value;
        payload.familiasVisitadas = document.getElementById("rel-familiasVisitadas").value;
        payload.pessoasVisitadas = document.getElementById("rel-pessoasVisitadas").value;
        payload.literaturas = document.getElementById("rel-literaturas").value;
        payload.conversoes = document.getElementById("rel-conversoes").value;
        payload.batismos = document.getElementById("rel-batismos").value;
        payload.curas = document.getElementById("rel-curas").value;
      } else {
        payload.area = document.getElementById("sec-area").value;
        payload.congregacao = document.getElementById("sec-congregacao").value;
        payload.nome = document.getElementById("sec-nome").value;
        payload.funcao = document.getElementById("sec-funcao").value;
        payload.dataNascimento = document.getElementById("sec-dataNascimento").value;
        payload.numeroCartao = document.getElementById("sec-numeroCartao").value;
        payload.apresentada = document.getElementById("sec-apresentada").value;
      }

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors", 
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify(payload)
        });

        alert("Relatório enviado com sucesso!");
        document.getElementById(tipo === 'relatorio' ? 'relatorioForm' : 'secretariaForm').reset();
      } catch (err) {
        alert("Erro ao enviar dados. Verifique sua conexão e tente novamente.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
