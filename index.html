<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Grupos Familiares</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <h1 class="text-2xl font-bold">Coordenação dos Grupos Familiares</h1>
      <p class="text-indigo-200 text-sm mt-1">Lançamento de Relatórios & Atualização de Perfil</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6">
    <!-- Abas de Navegação -->
    <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button id="tab-relatorio-btn" onclick="switchTab('relatorio')" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50">
        📊 Lançar Relatório
      </button>
      <button id="tab-secretaria-btn" onclick="switchTab('secretaria')" class="flex-1 py-3 px-4 font-semibold text-center text-gray-500 hover:text-indigo-600">
        👤 Perfil da Secretária
      </button>
    </div>

    <!-- FORMULÁRIO RELATÓRIO -->
    <section id="form-relatorio" class="bg-white p-6 rounded-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-indigo-900 border-b pb-2">Relatório Mensal de Desempenho</h2>
      <form id="relatorioForm" onsubmit="enviarDados(event, 'relatorio')" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Área</label>
            <select id="rel-area" required onchange="atualizarCongregacoes('rel-area', 'rel-congregacao')" class="w-full p-2 border rounded-md">
              <option value="">Selecione a Área</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Congregação</label>
            <select id="rel-congregacao" required class="w-full p-2 border rounded-md">
              <option value="">Selecione a Área primeiro</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Mês/Ano</label>
            <select id="rel-mesAno" required class="w-full p-2 border rounded-md">
              <option value="">Selecione o Mês/Ano</option>
            </select>
          </div>
        </div>

        <hr class="my-4 border-slate-200">

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <div><label class="block text-xs font-semibold mb-1">Grupos Formados</label><input type="number" id="rel-gruposFormados" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Matriculados</label><input type="number" id="rel-matriculados" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Presentes</label><input type="number" id="rel-presentes" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Voluntários</label><input type="number" id="rel-voluntarios" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Famílias Visitadas</label><input type="number" id="rel-familiasVisitadas" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Pessoas Visitadas</label><input type="number" id="rel-pessoasVisitadas" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Literaturas Distrib.</label><input type="number" id="rel-literaturas" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Conversões</label><input type="number" id="rel-conversoes" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Batismos no Esp. Santo</label><input type="number" id="rel-batismos" min="0" required class="w-full p-2 border rounded-md"></div>
          <div><label class="block text-xs font-semibold mb-1">Curas</label><input type="number" id="rel-curas" min="0" required class="w-full p-2 border rounded-md"></div>
        </div>

        <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-md transition duration-200">
          Enviar Relatório
        </button>
      </form>
    </section>

    <!-- FORMULÁRIO SECRETÁRIA -->
    <section id="form-secretaria" class="bg-white p-6 rounded-lg shadow-sm hidden">
      <h2 class="text-xl font-bold mb-4 text-indigo-900 border-b pb-2">Perfil da Secretária</h2>
      <form id="secretariaForm" onsubmit="enviarDados(event, 'secretaria')" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Área</label>
            <select id="sec-area" required onchange="atualizarCongregacoes('sec-area', 'sec-congregacao')" class="w-full p-2 border rounded-md">
              <option value="">Selecione a Área</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Congregação</label>
            <select id="sec-congregacao" required class="w-full p-2 border rounded-md">
              <option value="">Selecione a Área primeiro</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Nome Completo</label>
            <input type="text" id="sec-nome" required class="w-full p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Função</label>
            <select id="sec-funcao" required class="w-full p-2 border rounded-md">
              <option value="1ª Secretária">1ª Secretária</option>
              <option value="2ª Secretária">2ª Secretária</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Data de Nascimento</label>
            <input type="date" id="sec-dataNascimento" required class="w-full p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Nº Cartão de Membro</label>
            <input type="text" id="sec-numeroCartao" required class="w-full p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Apresentada?</label>
            <select id="sec-apresentada" required class="w-full p-2 border rounded-md">
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-md transition duration-200">
          Salvar Perfil
        </button>
      </form>
    </section>
  </main>

  <script>
    // URL do Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbzJPNUdzfTPMCAs2tdPzbMw2rcrBw2iw4hup6XRzk2hG7cEGeRErzPdmDGXiPQrMkCC/exec"; 

    // Mapeamento dos Dados de Área e Congregação (Corrigido Área 11 e 12)
    const dadosAreas = {
      "1": ["MATRIZ", "ANTONIO CASSIMIRO I", "AREIA BRANCA I", "HONORATO VIANA", "JARDIM MARAVILHA", "MARIA AUXILIADORA", "NOVA ATRÁS DA BANCA", "OURO PRETO", "VILA EULÁLIA"],
      "2": ["AREIA BRANCA II", "FERNANDO IDALINO I", "FERNANDO IDALINO II", "HENRIQUE LEITE I", "HENRIQUE LEITE II", "NOVA VILA VITÓRIA", "NOVO JATOBÁ", "PORTO DA ILHA", "RIVER SHOPPING", "VILA EDUARDO", "VILA VITÓRIA I"],
      "3": ["ALTO DA BOA VISTA", "COHAB IV", "COHAB V", "COHAB VI", "JARDIM PETRÓPOLIS III", "SÃO GONÇALO I", "SÃO GONÇALO II", "SÃO GONÇALO III"],
      "4": ["JOSÉ E MARIA I", "JOSÉ E MARIA II", "JOSÉ E MARIA III", "MONSENHOR BERNARDINO", "NOVA VILA MARCELA", "NOVO LOTEAMENTO RECIFE", "VILA DÉBORA I", "VIVENDAS", "VILA DÉBORA II"],
      "5": ["ALTO DO COCÁ", "JARDIM AMAZONAS I", "JARDIM SÃO PAULO I", "PEDRO RAIMUNDO", "QUATI", "VALE G. RIO I"],
      "6": ["ÁREA 19", "KM - 22", "KM - 25"],
      "7": ["ASSENTAMENTO MANDACARU", "FAZENDA VENEZA", "N - 1", "N - 2", "N - 3", "PONTA DA SERRA", "PORTEIRAS", "SITIO BARRAGEM"],
      "8": ["BEBEDOURO", "NOVA DESCOBERTA I", "NOVA DESCOBERTA III", "PEDRINHAS", "POÇO DA CRUZ", "PORTO DE PALHA", "SERROTE DE JESUS I", "SERROTE DE JESUS II"],
      "9": ["ALTO DA AREIA", "ALTO GRANDE", "ASSENTAMENTO JOSÉ RAMOS", "ASSENTAMENTO SÃO FRANCISCO", "FAZENDA TANQUE", "ISACOLÂNDIA I", "ISACOLÂNDIA II", "LAGOA GRANDE I", "LAGOA GRANDE III", "LAGOA GRANDE V", "RUA DO CAJUEIRO", "VASCO"],
      "10": ["ASSENTAMENTO CACHOEIRA", "CAPIM", "N - 10", "N - 11", "VILA 12", "VILA RENASCER"],
      "11": ["ASSENTAMENTO ESPERANÇA", "MASSAPÊ", "PAU FERRO", "RAJADA", "URUAIS"],
      "12": ["CAITITU"],
      "13": ["AGROVILA MASSANGANO", "ROÇADO", "SITIO SÃO JOÃO", "TAPERA", "TERRA DURA"],
      "14": ["COSME DAMIÃO I", "COSME DAMIÃO II", "JOÃO DE DEUS I", "JOÃO DE DEUS II", "JOÃO DE DEUS III", "JOÃO DE DEUS IV", "JOÃO DE DEUS V",  "NOVO TEMPO", "PEDRA LINDA I", "PEDRA LINDA III"],
      "15": ["ASSENTAMENTO ÁGUA VIVA I", "ASSENTAMENTO ÁGUA VIVA II", "C - 2", "LOTEAMENTO SIQUEIRA", "N - 4 I", "N - 4 II", "N - 5 I", "N - 5 II"],
      "16": ["CALDEIRÃOZINHO"],
      "17": ["DOM AVELAR I", "DOM AVELAR II", "DOM AVELAR IV", "MANDACARU I", "MANDACARU II", "SANTA LUZIA I", "SÃO JOAQUIM", "SÃO JORGE", "TERRA DO SUL I", "TERRA DO SUL II", "VILA ESPERANÇA"],
      "18": ["AGROISIA", "CATALUNIA", "CRUZ DO PONTAL", "ILHA DO PONTAL", "OURO VERDE", "VERMELHOS I", "VERMELHOS III"],
      "19": ["N - 6 I", "N - 6 II", "N - 6 III", "N - 7 I", "N - 7 II", "C - 3", "N - 8 I", "N - 8 II", "N - 9 I", "N - 9 II"],
      "20": ["RIO CORRENTE", "ASSENTAMENTO SÃO PAULO", "JARDIM GUARARAPES", "NOVA PETROLINA", "RESIDENCIAL BRASIL", "RESIDENCIAL POMARES", "JARDIM PETRÓPOLIS I", "JARDIM PETRÓPOLIS II"]
    };

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      carregarAreas();
      carregarMeses();
    });

    function carregarAreas() {
      const relArea = document.getElementById("rel-area");
      const secArea = document.getElementById("sec-area");
      
      Object.keys(dadosAreas).forEach(area => {
        const opt1 = new Option(`Área ${area}`, area);
        const opt2 = new Option(`Área ${area}`, area);
        relArea.add(opt1);
        secArea.add(opt2);
      });
    }

    function atualizarCongregacoes(areaSelectId, congSelectId) {
      const area = document.getElementById(areaSelectId).value;
      const congSelect = document.getElementById(congSelectId);
      congSelect.innerHTML = '<option value="">Selecione a Congregação</option>';

      if (area && dadosAreas[area]) {
        dadosAreas[area].forEach(cong => {
          congSelect.add(new Option(cong, cong));
        });
      }
    }

    function carregarMeses() {
      const mesSelect = document.getElementById("rel-mesAno");
      const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      const anoAtual = new Date().getFullYear();

      meses.forEach((mes) => {
        const valor = `${mes}/${anoAtual}`;
        mesSelect.add(new Option(valor, valor));
      });
    }

    function switchTab(tab) {
      const formRel = document.getElementById("form-relatorio");
      const formSec = document.getElementById("form-secretaria");
      const btnRel = document.getElementById("tab-relatorio-btn");
      const btnSec = document.getElementById("tab-secretaria-btn");

      if (tab === 'relatorio') {
        formRel.classList.remove("hidden");
        formSec.classList.add("hidden");
        btnRel.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50";
        btnSec.className = "flex-1 py-3 px-4 font-semibold text-center text-gray-500 hover:text-indigo-600";
      } else {
        formSec.classList.remove("hidden");
        formRel.classList.add("hidden");
        btnSec.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50";
        btnRel.className = "flex-1 py-3 px-4 font-semibold text-center text-gray-500 hover:text-indigo-600";
      }
    }

    async function enviarDados(event, tipo) {
      event.preventDefault();
      
      let payload = { tipo: tipo };

      if (tipo === 'relatorio') {
        payload.area = document.getElementById("rel-area").value;
        payload.congregacao = document.getElementById("rel-congregacao").value;
        payload.mesAno = document.getElementById("rel-mesAno").value;
        payload.gruposFormados = document.getElementById("rel-gruposFormados").value;
        payload.matriculados = document.getElementById("rel-matriculados").value;
        payload.presentes = document.getElementById("rel-presentes").value;
        payload.voluntarios = document.getElementById("rel-voluntarios").value;
        payload.familiasVisitadas = document.getElementById("rel-familiasVisitadas").value;
        payload.pessoasVisitadas = document.getElementById("rel-pessoasVisitadas").value;
        payload.literaturas = document.getElementById("rel-literaturas").value;
        payload.conversoes = document.getElementById("rel-conversoes").value;
        payload.batismos = document.getElementById("rel-batismos").value;
        payload.curas = document.getElementById("rel-curas").value;
      } else {
        payload.area = document.getElementById("sec-area").value;
        payload.congregacao = document.getElementById("sec-congregacao").value;
        payload.nome = document.getElementById("sec-nome").value;
        payload.funcao = document.getElementById("sec-funcao").value;
        payload.dataNascimento = document.getElementById("sec-dataNascimento").value;
        payload.numeroCartao = document.getElementById("sec-numeroCartao").value;
        payload.apresentada = document.getElementById("sec-apresentada").value;
      }

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors", 
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify(payload)
        });

        alert("Dados enviados com sucesso! Verifique sua planilha.");
        document.getElementById(tipo === 'relatorio' ? 'relatorioForm' : 'secretariaForm').reset();
      } catch (err) {
        alert("Erro ao enviar dados. Verifique sua conexão e tente novamente.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
